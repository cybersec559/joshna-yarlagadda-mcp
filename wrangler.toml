# Joshna Yarlagadda public MCP — Streamable HTTP at /mcp.
# Custom domain joshnayarlagadda.com/mcp is a later DNS / Workers route step.
# Do not put secrets in this file. v1 is authless (public site data only).

name = "joshna-yarlagadda-mcp"
main = "src/index.ts"
compatibility_date = "2026-07-02"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[dev]
ip = "0.0.0.0"
port = 8788

[observability]
enabled = true

# McpAgent stores each client session in a SQLite-backed Durable Object.
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "JoshnaMcp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JoshnaMcp"]

# After joshnayarlagadda.com is on Cloudflare DNS, attach the Worker to /mcp:
# [[routes]]
# pattern = "joshnayarlagadda.com/mcp"
# zone_name = "joshnayarlagadda.com"
#
# Or a workers.dev custom domain + route in the dashboard:
# Workers → joshna-yarlagadda-mcp → Settings → Domains & Routes
#   Route: joshnayarlagadda.com/mcp*
#
# Leave the public site on the apex; this Worker only needs the /mcp path
# (and optionally /sse for older Inspector clients).
